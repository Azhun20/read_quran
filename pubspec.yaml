name: read_quran
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6

  # Dependency Injection
  get_it: ^7.7.0

  # Routing
  go_router: ^12.1.3

  # Functional Programming
  dartz: ^0.10.1

  # HTTP Client
  dio: ^5.9.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # JSON Serialization
  json_annotation: ^4.9.0

  # Code Generation
  freezed_annotation: ^2.4.4

  # Image Processing
  image: ^4.7.2
  path_provider: ^2.1.2

  # Audio Playback
  just_audio: ^0.9.46
  audio_video_progress_bar: ^2.0.3

  # UI Enhancements
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Utils
  flutter_svg: ^2.2.3
  equatable: ^2.0.5
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  another_flushbar: ^1.12.32
  change_app_package_name: ^1.5.0
  connectivity_plus: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

  # Testing
  bloc_test: ^9.1.7

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

# Dependency overrides to resolve version conflicts
dependency_overrides:
  analyzer: ^6.4.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/lotties/
    - assets/icons/
    - assets/fonts/Rajdhani/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat-Thin.ttf
          weight: 100
        - asset: assets/fonts/Montserrat/Montserrat-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Montserrat/Montserrat-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Montserrat/Montserrat-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Montserrat/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat/Montserrat-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Montserrat/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat/Montserrat-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat/Montserrat-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Montserrat/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat/Montserrat-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Montserrat/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat/Montserrat-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Montserrat/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat/Montserrat-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Montserrat/Montserrat-Black.ttf
          weight: 900
        - asset: assets/fonts/Montserrat/Montserrat-BlackItalic.ttf
          weight: 900
          style: italic
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani/Rajdhani-Light.ttf
          weight: 300
        - asset: assets/fonts/Rajdhani/Rajdhani-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rajdhani/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani/Rajdhani-Bold.ttf
          weight: 700

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/ic_read_quran.png"
  adaptive_icon_foreground: "assets/icons/ic_read_quran_foreground.png"
  adaptive_icon_background: "#1a3d2e"
  remove_alpha_ios: true
