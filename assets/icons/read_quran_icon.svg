<svg width="512" height="512" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Read Quran App Icon</title>
  <desc>Circular Al-Quran calligraphy emblem with gold Arabic text on deep green background</desc>

  <rect width="160" height="160" rx="36" fill="#f5f0e8"/>

  <circle cx="80" cy="80" r="68" fill="#c9a84c"/>
  <circle cx="80" cy="80" r="62" fill="#1a3d2e"/>
  <circle cx="80" cy="80" r="57" fill="#1a3d2e" stroke="#c9a84c" stroke-width="1"/>

  <line x1="80" y1="26" x2="80" y2="42" stroke="#c9a84c" stroke-width="3" stroke-linecap="round"/>
  <line x1="76" y1="26" x2="76" y2="38" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
  <line x1="84" y1="26" x2="84" y2="38" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
  <path d="M74,28 Q80,24 86,28" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>

