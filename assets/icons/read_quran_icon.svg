  <path d="M60,115 Q80,122 100,115" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M65,120 Q80,126 95,120" fill="none" stroke="#c9a84c" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

  <path d="M26,72 Q30,80 26,88" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M134,72 Q130,80 134,88" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>

  <circle cx="70" cy="108" r="1.5" fill="#c9a84c"/>
  <circle cx="80" cy="111" r="1.5" fill="#c9a84c"/>
  <circle cx="90" cy="108" r="1.5" fill="#c9a84c"/>
